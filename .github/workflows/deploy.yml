# Builds the app and publishes it to GitHub Pages on every push to main (or manually from the Actions tab).
# VITE_* values come from repository variables: Settings → Secrets and variables → Actions → Variables.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      # Optional; empty values fall back to the defaults in src/config.js.
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
      VITE_CITY_NAME: ${{ vars.VITE_CITY_NAME }}
      VITE_CITY_CENTER: ${{ vars.VITE_CITY_CENTER }}
      VITE_CITY_ZOOM: ${{ vars.VITE_CITY_ZOOM }}
      VITE_CURRENCY: ${{ vars.VITE_CURRENCY }}
      VITE_LOCALE: ${{ vars.VITE_LOCALE }}
    steps:
      - uses: actions/checkout@v7

      - name: Check Firebase variables
        run: |
          missing=0
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set (Settings → Secrets and variables → Actions → Variables)."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
